name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test tests/Portmirror.Tests/Portmirror.Tests.csproj -c Release

      - name: Publish
        run: >
          dotnet publish src/Portmirror.Agent/Portmirror.Agent.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -o publish

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath portmirror-${{ github.ref_name }}-win-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: portmirror-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
